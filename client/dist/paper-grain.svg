<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
    <!-- Organic cotton paper pulp grain -->
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch" result="grain" />
    <!-- Directional organic paper fiber flecks -->
    <feTurbulence type="fractalNoise" baseFrequency="0.04 0.28" numOctaves="3" stitchTiles="stitch" result="fibers" />
    <!-- Merge paper pulp with fibers -->
    <feComposite in="grain" in2="fibers" operator="arithmetic" k1="0" k2="0.6" k3="0.4" k4="0" result="combined" />
    <!-- Carbon ink warm tint matrix for natural rag paper tooth -->
    <feColorMatrix type="matrix" values="
      0 0 0 0 0.14
      0 0 0 0 0.11
      0 0 0 0 0.08
      0 0 0 0.55 0" in="combined" result="coloredTexture" />
  </filter>
  <rect width="100%" height="100%" filter="url(#paper-texture)" />
</svg>
